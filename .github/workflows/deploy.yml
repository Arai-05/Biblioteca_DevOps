name: Deploy a EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compilar con Maven Wrapper
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests

      - name: Copia de los jars a la instancia EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: |
            eureka/target/cl-triskeledu-eureka-1.0-SNAPSHOT.jar
            api-gateway/target/cl-triskeledu-gateway-0.0.1-SNAPSHOT.jar
            ms-usuarios/target/cl-triskeledu-usuarios-0.0.1-SNAPSHOT.jar
            ms-catalogo/target/cl-triskeledu-catalogo-0.0.1-SNAPSHOT.jar
            ms-recursos/target/cl-triskeledu-recursos-0.0.1-SNAPSHOT.jar
          target: '/home/${{ secrets.EC2_USER }}/micros'
          strip_components: 2

      - name: Reiniciar los servicios
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            sudo systemctl restart eureka
            sleep 15

            sudo systemctl restart ms-usuarios
            sudo systemctl restart ms-catalogo
            sudo systemctl restart ms-recursos
            sleep 15

            sudo systemctl restart api-gateway

            sudo systemctl status eureka ms-usuarios ms-catalogo ms-recursos api-gateway --no-pager
