name: Deploy Biblioteca a EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compilar con el Maven Wrapper
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests

      - name: Preparar archivos JAR para despliegue
        run: |
          mkdir -p deploy-jars
          cp eureka/target/*.jar deploy-jars/
          cp api-gateway/target/*.jar deploy-jars/
          cp ms-usuarios/target/*.jar deploy-jars/
          cp ms-catalogo/target/*.jar deploy-jars/
          cp ms-recursos/target/*.jar deploy-jars/
          ls -la deploy-jars/

      - name: Copiar los jars a la instancia EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "deploy-jars/*.jar"
          target: "/home/${{ secrets.EC2_USER }}/micros"
          strip_components: 1

      - name: Reiniciar los servicios
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            sudo systemctl daemon-reload
            sudo systemctl restart eureka
            sleep 15
            sudo systemctl restart ms-usuarios
            sudo systemctl restart ms-catalogo
            sudo systemctl restart ms-recursos
            sleep 15
            sudo systemctl restart api-gateway
            sudo systemctl status eureka ms-usuarios ms-catalogo ms-recursos api-gateway --no-pager
